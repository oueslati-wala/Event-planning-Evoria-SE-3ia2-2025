{% extends 'base.html' %}
{% block content %}

<section class="contact-section">
<div class="container">
<h2 style="margin:0 0 1rem">Supprimer l'invitation</h2>
<p>Êtes-vous sûr de vouloir supprimer "{{ object }}" ?</p>
<form method="post" class="contact_form">
  {% csrf_token %}
  <button type="submit" class="boxed-btn5">Oui, supprimer</button>
  <a href="{% url 'InvitationAPP:invitation_list' %}" class="boxed-btn2" style="margin-left:8px">Annuler</a>
</form>
</div>
</section>

{% endblock %}
