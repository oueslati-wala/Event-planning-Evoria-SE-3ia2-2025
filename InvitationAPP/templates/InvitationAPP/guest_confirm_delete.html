{% extends 'base.html' %}
{% block content %}

<h2>Supprimer l'invité</h2>

<p>Êtes-vous sûr de vouloir supprimer l'invité {{ guest.first_name }} {{ guest.last_name }} de l'invitation {{ invitation.name }} ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a href="{% url 'InvitationAPP:guest_list' invitation.pk %}" class="btn btn-secondary">Annuler</a>
</form>

{% endblock %}
