{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Evoria{% endblock %}</title>
    <!-- Sunshine theme CSS (order mirrors template) -->
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'magnific-popup.css' %}">
    <link rel="stylesheet" href="{% static 'font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'themify-icons.css' %}">
    <link rel="stylesheet" href="{% static 'nice-select.css' %}">
    <link rel="stylesheet" href="{% static 'flaticon.css' %}">
    <link rel="stylesheet" href="{% static 'animate.css' %}">
    <link rel="stylesheet" href="{% static 'slicknav.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <!-- Project overrides (kept first to avoid overriding theme) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <nav class="nav">
            <a href="/" class="brand">Home</a>
            <a href="/Invitations/" class="link">Invitations</a>
            <a href="/Catering/" class="link">Restauration</a>
            {% if request.user.is_staff %}
            <a href="/Catering/caterers/" class="link">Traiteurs</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Software Engineering project using Django</p>
    </footer>

    <!-- Optional: Sunshine JS (needed for some interactions) -->
    <script src="{% static 'vendor/jquery-1.12.4.min.js' %}"></script>
    <script src="{% static 'popper.min.js' %}"></script>
    <script src="{% static 'bootstrap.min.js' %}"></script>
    <!-- Project JS -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
