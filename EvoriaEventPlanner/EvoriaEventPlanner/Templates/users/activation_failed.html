{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>

    <title>Activation échouée</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <style>

        .card-msg {
            background: #e6c9c4;

    <div class="flower_1 d-none d-lg-block" style="position: left-center;padding: 40px; padding-right: 60px;"">
