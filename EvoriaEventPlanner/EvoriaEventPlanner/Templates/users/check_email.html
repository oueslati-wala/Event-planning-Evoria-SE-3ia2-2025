{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Vérifiez votre email</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <style>

        .card-msg {
            background: #e6c9c4;
            padding: 40px 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            position: relative;
        }

        .card-msg h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .card-msg p {
            color: #555;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .btn-main {
            display: inline-block;
            background: #acab79;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            transition: .3s;
        }

        .btn-main:hover {
            background: #767553;
        }

    </style>
</head>

<body>

    <!-- Decorative flower -->
    <div class="flower_1 d-none d-lg-block" style="position: left-center;padding: 40px; padding-right: 60px;"">
        <img src="{% static 'img/appointment/flower-top.png' %}" alt="">
    </div>

    <div class="card-msg">
        <h2>Vérifiez votre email</h2>
        <p>Un lien d’activation vient de vous être envoyé.</p>
        <p>Veuillez vérifier votre boîte mail.</p>

        <a href="{% url 'login' %}" class="btn-main mt-3">Retour à la connexion</a>
    </div>

</body>

</html>
