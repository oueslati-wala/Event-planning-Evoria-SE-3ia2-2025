{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <style>
        .reset-container {
            background: #e6c9c4;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            margin: 60px auto;
        }

        .reset-container h2 {
            margin-bottom: 15px;
            color: #333;
            font-size: 24px;
        }

        .reset-container form button {
            width: 100%;
            padding: 12px;
            background: #acab79;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            transition: .3s;
            cursor: pointer;
        }

        .reset-container form button:hover {
            background: #89885e;
        }

        .message-success {
            color: green;
            margin-top: 15px;
        }

        .message-error {
            color: red;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <!-- decorative flower -->
    <div class="flower_1 d-none d-lg-block" style="position: absolute; top: 20px; left: 20px;">
        <img src="{% static 'img/appointment/flower-top.png' %}" alt="Flower">
    </div>

    <!-- RESET PASSWORD FORM -->
    <div class="reset-container">
        <h2>Réinitialisation du mot de passe</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Réinitialiser le mot de passe</button>
        </form>

        {% if message %}
        <p class="message-success">{{ message }}</p>
        {% endif %}

        {% if error %}
        <p class="message-error">{{ error }}</p>
        {% endif %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
